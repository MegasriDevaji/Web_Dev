<!DOCTYPE html>
<html>
<head>
<title>Book Hub</title>

<style>

/* 6. Hide element */
.hidden {
    display: none;
}

/* 7. Center div */
.container {
    width: 200px;
    margin: auto;
    text-align: center;
}

/* 8. Button hover */
button:hover {
    background-color: green;
    color: white;
}

/* 9. Bold & uppercase */
.heading {
    font-weight: bold;
    text-transform: uppercase;
}

/* 17. ID style */
#box {
    border: 1px solid black;
    padding: 10px;
}

/* 18. Class style */
.item {
    color: red;
}

/* 22. Flexbox center */
.flex-center {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
}

</style>

<script>

/* 10. Print current date */
console.log(new Date());

/* 11. Change background color */
function changeBg() {
    document.body.style.backgroundColor = "yellow";
}

/* 15. Alert function */
function showMsg() {
    alert("Hello");
}

/* 19. Check number >10 */
function checkNumber() {
    var num = document.getElementById("bookCount").value;
    if(num > 10) {
        console.log("Greater");
    }
}

/* 20. Add two numbers */
function addNumbers() {
    var a = parseInt(document.getElementById("num1").value);
    var b = parseInt(document.getElementById("num2").value);
    var sum = a + b;
    console.log(sum);
}

/* 23. Change button text */
function changeText() {
    document.getElementById("btn").innerHTML = "Clicked";
}

/* 25. Prevent form submission */
function preventSubmit(event) {
    event.preventDefault();
    
    var name = document.getElementById("name").value; // 12
    document.getElementById("demo").innerHTML = name; // 13
}

</script>

</head>

<body>

<h2 class="heading">📚 Book Hub Application</h2>

<!-- 5. Open link new tab -->
<a href="https://example.com" target="_blank">Visit Book Store</a>

<br><br>

<div class="container" id="box">

<form onsubmit="preventSubmit(event)">

<!-- 1. Mandatory text field -->
<input type="text" id="name" name="username" required placeholder="Enter Name">
<br><br>

<!-- 2. Email format -->
<input type="email" name="email" placeholder="Enter Email">
<br><br>

<!-- 3. Number between 1 and 10 -->
<input type="number" id="bookCount" min="1" max="10" placeholder="Books (1-10)">
<br><br>

<!-- 4. Radio default selected -->
<input type="radio" name="gender" checked> Male
<input type="radio" name="gender"> Female
<br><br>

<!-- 21. Required checkbox -->
<input type="checkbox" required> I Agree
<br><br>

<!-- 14. Button calling function -->
<button type="button" onclick="showMsg()">Say Hello</button>
<br><br>

<button type="button" onclick="changeBg()">Change Background</button>
<br><br>

<button type="button" onclick="checkNumber()">Check Number</button>
<br><br>

<!-- 20 Add numbers -->
<input type="number" id="num1" placeholder="Num1">
<input type="number" id="num2" placeholder="Num2">
<button type="button" onclick="addNumbers()">Add</button>
<br><br>

<!-- 23 Change text -->
<button type="button" id="btn" onclick="changeText()">Click Me</button>
<br><br>

<!-- 24 Progress bar -->
<progress value="50" max="100"></progress>
<br><br>

<button type="submit">Submit</button>

</form>

</div>

<br>

<!-- 13 Display name -->
<p id="demo" class="item"></p>

<!-- 22 Flexbox Center Example -->
<div class="flex-center">
    Centered Content
</div>

</body>
</html>
