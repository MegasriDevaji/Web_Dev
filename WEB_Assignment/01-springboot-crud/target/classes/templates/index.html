<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub CRUD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f6f4ee;
            color: #1f2937;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #6b3f1d;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }
        .button {
            text-decoration: none;
            background: #8b5e34;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }
        th {
            background: #f8efe3;
        }
        .actions a {
            margin-right: 12px;
            color: #8b5e34;
            text-decoration: none;
            font-weight: bold;
        }
        .empty {
            padding: 24px 0;
            color: #6b7280;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div>
            <h1>BookHub Inventory</h1>
            <p>Simple CRUD application for managing books in an e-commerce platform.</p>
        </div>
        <a class="button" th:href="@{/books/new}">Add New Book</a>
    </div>

    <table th:if="${!books.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.category}"></td>
            <td th:text="${book.price}"></td>
            <td class="actions">
                <a th:href="@{'/books/edit/' + ${book.id}}">Edit</a>
                <a th:href="@{'/books/delete/' + ${book.id}}" onclick="return confirm('Delete this book?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${books.isEmpty()}">
        No books available. Add one to get started.
    </div>
</div>
</body>
</html>
