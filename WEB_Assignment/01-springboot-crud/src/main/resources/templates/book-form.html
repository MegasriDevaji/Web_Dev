<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Book Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f6f4ee;
            color: #1f2937;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #6b3f1d;
        }
        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .error {
            color: #b91c1c;
            font-size: 14px;
            margin-top: 6px;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }
        button, a {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        button {
            background: #8b5e34;
            color: white;
        }
        a {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${pageTitle}">Book Form</h1>

    <form th:action="@{${actionUrl}}" th:object="${book}" method="post">
        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}">
        <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>

        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}">
        <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>

        <label for="price">Price</label>
        <input id="price" type="number" step="0.01" th:field="*{price}">
        <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

        <div class="actions">
            <button type="submit">Save</button>
            <a th:href="@{/}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
